name: Build Android APK

on:
  push:
    branches: [ "production" ] # Só gera o APK quando você der push para production

jobs:
  build:
    runs-on: windows-latest # Usa uma máquina Windows do GitHub

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Install MAUI Workload
      run: dotnet workload install maui-android

    # O PULO DO GATO: Criando o arquivo de segredos em tempo de execução
    - name: Create AppSettings
      run: |
        echo '{
          "AppConfiguration": {
            "NewsApiKey": "${{ secrets.NEWS_API_KEY }}",
            "GeminiApiKey": "${{ secrets.GEMINI_API_KEY }}"
          }
        }' > NewsApp.Web/wwwroot/appsettings.json

    - name: Restore dependencies
      run: dotnet restore

    - name: Build APK
      run: dotnet build NewsApp.Mobile/NewsApp.Mobile.csproj -c Release -f net9.0-android --no-restore

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: news-app-android
        path: NewsApp.Mobile/bin/Release/net9.0-android/*-Signed.apk
